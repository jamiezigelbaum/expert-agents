name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Clean install
        run: bun install --frozen-lockfile
      # The worker's long-PDF split and coverage check run qpdf and pdftotext,
      # and media ingest downmixes audio with ffmpeg; their tests use the real binaries.
      - name: PDF and media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils ffmpeg
      - name: Full verification
        run: bun run verify

  # The worker image is a deploy artifact in its own right: build it from this
  # exact commit and prove it boots and answers health with networking
  # disabled (scripts/docker-smoke.sh). Static Dockerfile invariants are part
  # of `bun run verify`; this job is the half that needs Docker.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the worker image and smoke it with networking disabled
        run: bash scripts/docker-smoke.sh expert-agents-domain-expert:ci

  # The page library kept in Postgres, against a real pgvector database:
  # ingest, two routes on one library, a private library in its own database,
  # the operator CLI and its grants (packages/runtime/test-db). It needs a
  # database, so it is its own job rather than a skip inside verify.
  page-library-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_USER: pages
          POSTGRES_PASSWORD: pages-ci
          POSTGRES_DB: pages
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pages" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Clean install
        run: bun install --frozen-lockfile
      - name: PDF and media tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qpdf poppler-utils ffmpeg
      - name: Page library database tests
        working-directory: packages/runtime
        env:
          PAGE_LIBRARY_TEST_DATABASE_URL: postgres://pages:pages-ci@127.0.0.1:5432/pages
        run: bun run test:db

  # deploy/page-library/compose.yaml from nothing: image, roles, migrate,
  # an import from "another host", and the worker serving from the database.
  page-library-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Stand up a library with compose and serve from it
        run: bash scripts/page-library-smoke.sh
